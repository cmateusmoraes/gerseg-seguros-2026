name: CI & Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Validate production export
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            out/index.html
            out/.htaccess
            out/robots.txt
            out/sitemap.xml
            out/assets/imagens/gerseg-social-share.jpg
          )

          for file in "${required_files[@]}"; do
            test -s "$file" || {
              echo "Required production file is missing or empty: $file"
              exit 1
            }
          done

          grep -Fq "gerseg-social-share.jpg" out/index.html || {
            echo "Social sharing metadata is missing from the home page"
            exit 1
          }

          test "$(find out -type f | wc -l)" -gt 100 || {
            echo "Static export contains fewer files than expected"
            exit 1
          }

      - name: Package production artifact
        uses: actions/upload-artifact@v4
        with:
          name: gerseg-site-${{ github.sha }}
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Dialhost
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gerseg-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.gersegseguros.com.br/
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: gerseg-site-${{ github.sha }}
          path: out

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || {
            echo "DEPLOY_SSH_KEY is not configured in the production environment"
            exit 1
          }
          test -n "$DEPLOY_SSH_KNOWN_HOSTS" || {
            echo "DEPLOY_SSH_KNOWN_HOSTS is not configured in the production environment"
            exit 1
          }

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Check Dialhost destination
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PATH: ${{ vars.DEPLOY_SSH_PATH }}
        run: |
          set -euo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$DEPLOY_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          test -n "$DEPLOY_SSH_HOST" || { echo "DEPLOY_SSH_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_SSH_USER" || { echo "DEPLOY_SSH_USER is not configured"; exit 1; }
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "DEPLOY_SSH_PORT is invalid"; exit 1; }

          test "$DEPLOY_SSH_PATH" = "/home/gersegse/public_html" || {
            echo "Refusing to deploy to unexpected path: $DEPLOY_SSH_PATH"
            exit 1
          }

          ssh "${ssh_options[@]}" "$remote" \
            "command -v rsync >/dev/null && test -d '$DEPLOY_SSH_PATH' && test -w '$DEPLOY_SSH_PATH'"

          remote_free_kb="$(ssh "${ssh_options[@]}" "$remote" \
            "df -Pk '$DEPLOY_SSH_PATH' | awk 'NR == 2 { print \$4 }'")"
          [[ "$remote_free_kb" =~ ^[0-9]+$ ]] && (( remote_free_kb >= 30720 )) || {
            echo "Dialhost must have at least 30 MB free before deployment"
            exit 1
          }

      - name: Publish static site
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PATH: ${{ vars.DEPLOY_SSH_PATH }}
        run: |
          set -euo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"

          rsync -rlvz \
            --checksum \
            --delete-delay \
            --delay-updates \
            --itemize-changes \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='email/' \
            --exclude='google*.html' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p ${DEPLOY_SSH_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./out/ "${remote}:${DEPLOY_SSH_PATH%/}/"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          home_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://www.gersegseguros.com.br/)"

          grep -Fq "gerseg-social-share.jpg" <<< "$home_html" || {
            echo "The production home page does not contain the expected sharing metadata"
            exit 1
          }

          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://www.gersegseguros.com.br/robots.txt >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://www.gersegseguros.com.br/assets/imagens/gerseg-social-share.jpg >/dev/null
